[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# The tests deploy the original Uniswap V2 bytecode from test/fixtures.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fmt]
line_length = 120

[lint]
lint_on_build = false
